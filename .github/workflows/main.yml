name: Open Jarvis Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/jarvis-stable-1.0
      - feature/jarvis-stable-1.0-phase2-wakeword

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke-minimal.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
