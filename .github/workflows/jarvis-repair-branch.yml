name: Jarvis Autonomous Repair Branch

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Feature branch to repair (feature/* only)
        required: true
        default: feature/autonomous-self-healing-edition
        type: string
      patch_b64:
        description: Base64-encoded unified diff generated by Open Jarvis
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jarvis-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate target branch input
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          ref = os.environ["BASE_REF"]
          if not re.fullmatch(r"feature/[A-Za-z0-9._/-]+", ref):
              raise SystemExit("Only feature/* branches may be repaired")
          if ".." in ref.split("/") or ref.endswith("/") or "//" in ref:
              raise SystemExit("Invalid base branch name")
          PY

      - name: Checkout requested feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Validate and apply AI patch
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess

          encoded = os.environ["PATCH_B64"]
          if len(encoded) > 32000:
              raise SystemExit("Encoded patch exceeds 32 KB limit")
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) > 24000:
              raise SystemExit("Decoded patch exceeds 24 KB limit")
          patch = raw.decode("utf-8")
          if not patch.strip() or "\x00" in patch:
              raise SystemExit("Patch is empty or contains invalid bytes")
          pathlib.Path("/tmp/jarvis-repair.patch").write_text(patch, encoding="utf-8")
          PY
          git apply --check --whitespace=error /tmp/jarvis-repair.patch
          git apply --whitespace=error /tmp/jarvis-repair.patch
          python3 - <<'PY'
          import pathlib, subprocess

          allowed = (
              "app/src/main/java/com/openjarvis/",
              "app/src/test/java/com/openjarvis/",
          )
          raw = subprocess.check_output([
              "git", "status", "--porcelain=v1", "-z", "--untracked-files=all"
          ])
          entries = [entry for entry in raw.split(b"\0") if entry]
          if not entries:
              raise SystemExit("Patch produced no changes")

          for entry in entries:
              status = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8")
              if not path.startswith(allowed) or ".." in path.split("/"):
                  raise SystemExit(f"Protected or out-of-scope path: {path}")
              if not path.endswith(".kt"):
                  raise SystemExit(f"Only Kotlin source/test files are allowed: {path}")
              if status not in (" M", "M ", "??"):
                  raise SystemExit(f"Unsupported change type {status!r}: {path}")
              if path.startswith("app/src/test/") and status != "??":
                  raise SystemExit(f"Existing tests may not be modified or deleted: {path}")
              candidate = pathlib.Path(path)
              current = pathlib.Path.cwd()
              for part in candidate.parts:
                  current = current / part
                  if current.is_symlink():
                      raise SystemExit(f"Symlink paths are not allowed: {path}")
              if not candidate.is_file():
                  raise SystemExit(f"Expected a regular Kotlin file: {path}")
          PY

      - name: Run unit and regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build candidate debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit only after tests and build pass
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          git add -- app/src/main/java/com/openjarvis app/src/test/java/com/openjarvis
          if git diff --cached --quiet; then
            echo "No validated Kotlin changes to commit"
            exit 1
          fi
          git config user.name "Open Jarvis Repair Bot"
          git config user.email "open-jarvis-repair[bot]@users.noreply.github.com"
          BRANCH="autonomous-repair/${GH_RUN_ID}"
          git switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null commit -m "Autonomous repair: validated Kotlin patch"

      - name: Push validated repair branch
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          BRANCH="autonomous-repair/${GH_RUN_ID}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
              -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              push "https://github.com/sandipsonawane73618-coder/open-jarvis.git" "$BRANCH"
