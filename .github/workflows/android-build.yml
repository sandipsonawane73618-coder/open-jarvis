name: Android Build

on:
  push:
    branches: [main, feature/euronics-webview-integration, feature/jarvis-stable-1.0, feature/jarvis-opendroid-agent-loop, feature/jarvis-slice-c-router-llm-schema, feature/jarvis-phase2-continuation, feature/jarvis-diagnostic-export, feature/jarvis-command-listener-no-wakeword, feature/jarvis-fast-response-streaming, feature/jarvis-streaming-response, feature/jarvis-contact-app-intent-priority, feature/jarvis-single-floating-overlay, feature/jarvis-multilingual-volume-routing, feature/jarvis-tts-utterance-callback-isolation, feature/jarvis-false-completion-guard, feat/jarvis-v3-agent-loop]
    paths:
      - "app/**"
      - "scripts/**"
      - ".agents/**"
      - ".codex/**"
      - "AGENTS.md"
      - "docs/development/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main, feature/jarvis-full-potential-foundation, feature/jarvis-manual-mic-hud-headroom, feature/jarvis-m3-m5-proactive-hud, feature/jarvis-stable-1.0, feature/jarvis-stable-1.0-phase2-wakeword, feature/jarvis-stable-1.0-phase3-ollama, feature/jarvis-stable-1.0-phase4-command-execution, feature/jarvis-jandal-memory-recall, feature/jarvis-slice-c-router-llm-schema, feature/jarvis-phase1-p0-security, feature/jarvis-phase2-continuation, feature/jarvis-command-listener-no-wakeword, feature/jarvis-foreground-banking-guard, feature/jarvis-continuous-voice-session, feature/jarvis-self-healing-retry-gates, feature/jarvis-conversation-memory-marathi, feature/jarvis-fast-response-streaming, feature/jarvis-streaming-response, feature/jarvis-contact-app-intent-priority, feature/jarvis-single-floating-overlay, feature/jarvis-multilingual-volume-routing, integration/android-stack-v2, fix/jarvis-unknown-command-and-repeat, integration/jarvis-memory-hybrid-final, fix/jarvis-command-routing, baseline/jarvis-v3]
    paths:
      - "app/**"
      - "scripts/**"
      - ".agents/**"
      - ".codex/**"
      - "AGENTS.md"
      - "docs/development/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: ECC project guardrails
        run: bash scripts/ecc-guardrails.sh

      - name: Validate feature-to-test map
        run: python3 scripts/check-feature-test-map.py

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

  agent-security-scan:
    name: ecc-agentshield-security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan agent instructions, skills, and project configuration
        run: |
          mkdir -p artifacts
          npx --yes ecc-agentshield@1.6.0 scan --path . --format json --output artifacts/agentshield-report.json

      - name: Upload AgentShield report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-agentshield-report
          path: artifacts/agentshield-report.json
          if-no-files-found: warn

  apk-build:
    name: apk-build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Restore stable preview debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: open-jarvis-preview-debug-signing-v1

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke-test:
    name: smoke-test-minimal
    needs: apk-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Install, resume MainActivity, and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2 -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/smoke-minimal.sh

      - name: Upload minimal smoke logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-smoke-logcat
          path: artifacts/minimal-smoke-logcat.txt
          if-no-files-found: error


  release-ready-apk:
    name: release-ready-preview-apk
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Download smoke-tested candidate APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Verify APK artifact exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish verified Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  euronics-ui-optional:
    name: euronics-ui-optional (non-blocking)
    needs: apk-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/euronics-webview-integration'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Android emulator Euronics V32 UI tap validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2 -no-metrics
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/euronics-smoke.sh

      - name: Upload Euronics UI hierarchy on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euronics-ui-hierarchy
          path: artifacts/euronics-ui.xml
          if-no-files-found: error
