name: JARVIS Stability Gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/jarvis-opendroid-agent-loop
      - feature/jarvis-deterministic-fast-skills

permissions:
  contents: read

concurrency:
  group: jarvis-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Prepare sherpa-onnx runtime
        run: bash scripts/prepare-sherpa.sh aar
      - name: Run all debug unit tests
        run: gradle testDebugUnitTest --no-daemon

  apk-build:
    name: apk-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Prepare sherpa-onnx runtime and KWS model
        run: bash scripts/prepare-sherpa.sh all
      - name: Build preview APK
        run: gradle assembleDebug --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke-test-minimal:
    name: smoke-test-minimal
    needs: apk-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Open-Jarvis-Preview-APK
          path: app/build/outputs/apk/debug
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2'
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/smoke-minimal.sh
